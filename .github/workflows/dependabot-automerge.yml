name: Auto-merge Dependabot

on:
  workflow_run:
    workflows: [Build and Publish]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge verified Dependabot update
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: write
    steps:
      # workflow_run uses the default branch: never execute code from the PR.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify checks and merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/dependabot-automerge.cjs
